services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: gunpla-scraper
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - n8n
    networks:
      - gunpla-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: gunpla-scheduler
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
    command: python scheduler.py
    depends_on:
      - scraper
      - n8n
    networks:
      - gunpla-network
    restart: unless-stopped

  hlj-lowstock:
    build:
      context: ./scripts
      dockerfile: hlj-lowstock/Dockerfile
    container_name: gunpla-hlj-lowstock
    ports:
      - "8001:8000"
    volumes:
      - ./scripts/hlj-lowstock:/app
      - ./scripts/app:/app/app:ro
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
    networks:
      - gunpla-network
    restart: unless-stopped

  hlj-preorder:
    build:
      context: ./scripts
      dockerfile: hlj-preorder/Dockerfile
    container_name: gunpla-hlj-preorder
    ports:
      - "8010:8000"
    volumes:
      - ./scripts/hlj-preorder:/app
      - ./scripts/app:/app/app:ro
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
    networks:
      - gunpla-network
    restart: unless-stopped

  lowstock-agent:
    build:
      context: .
      dockerfile: scripts/lowstock_agent/Dockerfile
    container_name: gunpla-lowstock-agent
    env_file:
      - .env
    environment:
      - HLJ_LOWSTOCK_URL=http://hlj-lowstock:8000
      - SUPABASE_URL=http://kong:8000
    command: python -m scripts.lowstock_agent.scheduler
    depends_on:
      - hlj-lowstock
    networks:
      - gunpla-network
    restart: unless-stopped

  lowstock-review:
    build:
      context: .
      dockerfile: scripts/lowstock_agent/Dockerfile
    container_name: gunpla-lowstock-review
    ports:
      - "8011:8011"
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
    command: uvicorn scripts.lowstock_agent.review_app:app --host 0.0.0.0 --port 8011
    networks:
      - gunpla-network
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: gunpla-n8n
    ports:
      - "5679:5678"
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000

    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    networks:
      - gunpla-network
    restart: unless-stopped

  supabase:
    image: supabase/postgres:17.6.1.143
    container_name: gunpla-supabase
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PGUSER: postgres
    volumes:
      # fresh volume: the old supabase-data holds an incompatible PG15 datadir
      - supabase-db-data:/var/lib/postgresql/data
    networks:
      - gunpla-network
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: gunpla-rest
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      - supabase
    networks:
      - gunpla-network
    restart: unless-stopped

  kong:
    image: kong:2.8.1
    container_name: gunpla-kong
    ports:
      - "54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
    volumes:
      - ./kong.yml:/home/kong/kong.yml:ro
    depends_on:
      - rest
    networks:
      - gunpla-network
    restart: unless-stopped

  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: gunpla-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - supabase
    networks:
      - gunpla-network
    restart: unless-stopped

  # best-effort admin UI; nothing depends on it — drop if it misbehaves
  studio:
    image: supabase/studio:latest
    container_name: gunpla-studio
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      - meta
      - kong
    networks:
      - gunpla-network
    restart: unless-stopped

  doc-ingest:
    build:
      context: ./doc-ingest
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
    volumes:
      - ./doc-ingest:/app
    command: python ingest.py
    depends_on:
      - supabase
    networks:
      - gunpla-network
    # ingest.py is a one-shot script that exits 0. Any restart policy other
    # than "no" makes Docker rerun it forever; that once wrote 108k rows.
    # Run deliberately: docker compose run --rm doc-ingest
    restart: "no"
    profiles: ["manual"]

  hf-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: gunpla-hf-embed
    ports:
      - "5001:5001"
    environment:
      HF_MODEL_ID: sentence-transformers/all-MiniLM-L6-v2
    command: >
      --model-id sentence-transformers/all-MiniLM-L6-v2
      --hostname 0.0.0.0
      --port 5001
    networks:
      - gunpla-network
    restart: unless-stopped

  yourls-db:
    image: mariadb:10.11
    container_name: gunpla-yourls-db
    environment:
      MYSQL_ROOT_PASSWORD: ${YOURLS_DB_ROOT_PASS}
      MYSQL_DATABASE: yourls
      MYSQL_USER: yourls
      MYSQL_PASSWORD: ${YOURLS_DB_PASS}
    volumes:
      - yourls-db-data:/var/lib/mysql
    networks:
      - gunpla-network
    restart: unless-stopped

  yourls:
    image: yourls
    container_name: gunpla-yourls
    ports:
      - "8002:8080"
    environment:
      YOURLS_SITE: ${YOURLS_DOMAIN_URL}
      YOURLS_USER: ${YOURLS_USER}
      YOURLS_PASS: ${YOURLS_PASS}
      YOURLS_DB_HOST: yourls-db
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: ${YOURLS_DB_PASS}
      YOURLS_DB_NAME: yourls
    depends_on:
      - yourls-db
    networks:
      - gunpla-network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: gunpla-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/go.ugfinds.online.conf:/etc/nginx/conf.d/go.ugfinds.online.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - yourls
    networks:
      - gunpla-network

  bandai-scraper:
    build:
      context: ./bandai-scraper
      dockerfile: Dockerfile
    container_name: bandai-scraper
    restart: unless-stopped
    ports:
      - "8003:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SUPABASE_URL=http://kong:8000
    volumes:
      - ./bandai-scraper/output:/app/output
    networks:
      - gunpla-network
    shm_size: '1gb'
    deploy:
      resources:
        limits:
          memory: 2G

  nams-framework:
    build: ./nams
    env_file: .env
    environment:
      SUPABASE_URL: http://kong:8000
    volumes:
      - ./nams:/app
    depends_on:
      - supabase
      - hf-embed
    networks:
      - gunpla-network
    restart: unless-stopped

volumes:
  n8n-data:
  supabase-data:
  supabase-db-data:
  yourls-db-data:

networks:
  gunpla-network:
    external: true
    name: gunpla-tracker-verified_gunpla-network


